<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kind Mita</title>
<meta name="description" content="Nice to meet you! I’m… Kind Mita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/title-en.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/title-cn.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">

<!-- Hide the two <h1> lines before the intro can run, so they never flash in
     their final position first. intro.js drops the class when it starts; the
     timeout drops it if gsap never loads, so a dead CDN costs the animation
     and nothing else. -->
<script>
  document.documentElement.classList.add('js-intro');
  window.__introFallback = setTimeout(function () {
    document.documentElement.classList.remove('js-intro');
  }, 2500);
</script>
</head>
<body>

<main class="hero">
  <div class="hero-bg" aria-hidden="true"></div>

  <div class="wrap">

    <div class="col-left">

      <div class="eyebrow-row">
        <span class="eyebrow" data-i18n="eyebrow"></span>

        <button type="button" id="lang" class="pill lang-btn" data-i18n-attr="aria-label:lang.switch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
          </svg>
          <span data-i18n="lang.label"></span>
        </button>
      </div>

      <!-- the outlined title is drawn twice (text + ::after), so give it an
           explicit label instead of letting the copy be announced as well -->
      <h1 data-i18n-attr="aria-label:hero.a11yTitle">
        <span class="greet" data-i18n="hero.greet"></span>
        <span class="name-line">
          <span class="name" data-i18n="hero.name" data-i18n-attr="data-text:hero.name"></span>
          <span class="name-bar" aria-hidden="true"></span>
        </span>
      </h1>

      <p data-i18n-html="about.p1"></p>

      <p data-i18n-html="about.p2"></p>

      <ul class="chips">
        <li class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
          </svg>
          <span data-i18n="chip.resident"></span>
        </li>
        <li class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/>
          </svg>
          <span data-i18n="chip.solver"></span>
        </li>
        <li class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/>
          </svg>
          <span data-i18n="chip.walking"></span>
        </li>
        <li class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/>
          </svg>
          <span data-i18n="chip.humor"></span>
        </li>
        <li class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/>
          </svg>
          <span data-i18n="chip.core"></span>
        </li>
      </ul>

    </div>

    <div class="col-right">
      <div class="avatar-card">
        <div class="avatar-circle">
          <img src="assets/kind.webp" data-i18n-attr="alt:avatar.alt" alt="" width="768" height="768">
        </div>
        <img class="particle p1" src="assets/particles/particle1.webp" alt="" aria-hidden="true" width="133" height="270">
        <img class="particle p2" src="assets/particles/particle2.webp" alt="" aria-hidden="true" width="50" height="71">
        <img class="particle p3" src="assets/particles/particle3.webp" alt="" aria-hidden="true" width="32" height="81">
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="wrap foot-wrap">
    <p class="copy" data-i18n="foot.copy"></p>

    <nav class="socials">
      <a class="pill" href="mailto:kind.mita@outlook.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        <span data-i18n="foot.email"></span>
      </a>
      <a class="pill" href="https://github.com/kindmita">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>
        </svg>
        <span data-i18n="foot.github"></span>
      </a>
      <button class="pill pill-alt pill-copy" type="button" id="discord"
              data-copy="kind.mita"
              data-i18n-attr="aria-label:foot.discordCopy; data-label-copy:foot.discordCopy; data-label-open:foot.discordCopied">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
        </svg>
        <!-- Both labels sit in the button at once: the width animation needs
             something to measure, and only one of them is ever visible. -->
        <span class="swap">
          <span class="swap-txt swap-idle" data-i18n="foot.discord"></span>
          <span class="swap-txt swap-done" data-i18n="foot.discordCopied" aria-hidden="true"></span>
        </span>
      </button>
    </nav>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
<script src="intro.js"></script>
</body>
</html>
